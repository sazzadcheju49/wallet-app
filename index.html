<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>Wallet</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Poppins:wght@600;700;800&display=swap" rel="stylesheet">
  <link rel="manifest" href="manifest.json">
  <meta name="theme-color" content="#4f6ef7">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="mobile-web-app-capable" content="yes">
  <style>
    :root {
      --bg: #13141a;
      --surface: #21232e;
      --surface2: #292c38;
      --border: #2e3247;
      --text-primary: #f0f2ff;
      --text-secondary: #8b92b0;
      --accent: #4f6ef7;
      --income: #22c55e;
      --expense: #f43f5e;
      --needs: #06b6d4;
      --wants: #f59e0b;
      --invest: #8b5cf6;
      --orange: #f97316;
      --radius-card: 18px;
      --radius-button: 13px;
      --radius-chip: 22px;
      --radius-icon: 12px;
      --nav-h: 82px;
      --ease: 200ms ease;
    }

    /* Light Theme Colors */
    [data-theme="light"] {
      --bg: #f2f3f7;
      --surface: #ffffff;
      --surface2: #e8e9f0;
      --border: #d1d5db;
      --text-primary: #111827;
      --text-secondary: #6b7280;
    }

    /* Standard Theme Colors */
    [data-theme="standard"] {
      --bg: #1a1c26;
      --surface: #242736;
      --surface2: #2d3145;
      --border: #383e56;
      --text-primary: #ffffff;
      --text-secondary: #a0a7c1;
    }

    * { box-sizing: border-box; }
    html { min-height: 100%; background: var(--bg); -webkit-text-size-adjust: 100%; }
    body {
      margin: 0;
      min-height: 100vh;
      background: var(--bg);
      color: var(--text-primary);
      font-family: Inter, system-ui, sans-serif;
      -webkit-tap-highlight-color: transparent;
      overflow-x: hidden;
    }
    button, input, textarea, select { font: inherit; color: inherit; }
    button { border: 0; cursor: pointer; }
    .app {
      width: min(100%, 520px);
      min-height: 100vh;
      margin: 0 auto;
      padding-bottom: calc(var(--nav-h) + env(safe-area-inset-bottom) + 14px);
      background:
        radial-gradient(circle at 20% 0%, rgba(79, 110, 247, .14), transparent 28%),
        var(--bg);
    }
    .screen {
      display: none;
      padding: 18px 16px 0;
      animation: fadeIn 150ms ease;
    }
    .screen.active { display: block; }
    @keyframes fadeIn { from { opacity: .4; } to { opacity: 1; } }
    h1, h2, h3, .amount, .brand { font-family: Poppins, Inter, sans-serif; letter-spacing: 0; }
    h1 { margin: 0 0 16px; font-size: 28px; line-height: 1.1; }
    h2 { margin: 0; font-size: 18px; }
    h3 { margin: 0; font-size: 15px; }
    p { margin: 0; color: var(--text-secondary); }
    .topbar {
      display: flex;
      align-items: center;
      justify-content: space-between;
      margin-bottom: 16px;
    }
    .brand { font-size: 27px; font-weight: 800; }
    .card {
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: var(--radius-card);
      transition: transform var(--ease), border-color var(--ease), background var(--ease);
    }
    .press:active, .chip:active, .icon-btn:active, .btn:active { transform: scale(.97); }
    .btn {
      min-height: 46px;
      padding: 0 16px;
      border-radius: var(--radius-button);
      background: var(--accent);
      color: #fff;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: 8px;
      font-family: Poppins, Inter, sans-serif;
      font-weight: 700;
      transition: transform var(--ease), opacity var(--ease), background var(--ease);
    }
    .btn.secondary { background: var(--surface2); color: var(--text-primary); border: 1px solid var(--border); }
    .btn.danger { background: var(--expense); }
    .btn.ghost { background: transparent; border: 1px solid var(--border); color: var(--text-secondary); }
    
    /* Layout for Save/Delete Alignment */
    .sheet-actions {
      display: flex;
      flex-direction: row-reverse;
      gap: 12px;
      margin-top: 20px;
    }
    .sheet-actions .btn { flex: 1; }

    .icon-btn {
      width: 42px;
      height: 42px;
      border-radius: var(--radius-icon);
      background: var(--surface2);
      color: var(--text-primary);
      display: inline-grid;
      place-items: center;
      transition: transform var(--ease), background var(--ease), color var(--ease);
    }
    .icon-btn.small { width: 34px; height: 34px; }
    .chip {
      min-height: 34px;
      padding: 0 13px;
      border-radius: var(--radius-chip);
      background: var(--surface2);
      color: var(--text-secondary);
      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: 6px;
      white-space: nowrap;
      border: 1px solid transparent;
      transition: transform var(--ease), background var(--ease), color var(--ease), border-color var(--ease);
    }
    .chip.active { background: var(--accent); color: #fff; }
    .chip.needs { background: rgba(6,182,212,.15); color: var(--needs); }
    .chip.wants { background: rgba(245,158,11,.15); color: var(--wants); }
    .chip.invest { background: rgba(139,92,246,.15); color: var(--invest); }
    .row { display: flex; align-items: center; gap: 10px; }
    .between { display: flex; align-items: center; justify-content: space-between; gap: 12px; }
    .stack { display: grid; gap: 12px; }
    .muted { color: var(--text-secondary); }
    .tiny { font-size: 12px; }
    .ellipsis { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
    .scroll-x {
      display: flex;
      gap: 9px;
      overflow-x: auto;
      scrollbar-width: none;
      -webkit-overflow-scrolling: touch;
      padding-bottom: 2px;
    }
    .scroll-x::-webkit-scrollbar { display: none; }
    .amount.blurred { filter: blur(6px); }
    .income-color { color: var(--income); }
    .expense-color { color: var(--expense); }
    .hero {
      padding: 22px;
      background:
        linear-gradient(145deg, rgba(79, 110, 247, .28), rgba(79, 110, 247, .04)),
        var(--surface);
      overflow: hidden;
    }
    .hero .amount { font-size: clamp(34px, 11vw, 48px); font-weight: 800; line-height: 1.05; margin-top: 8px; }
    .account-grid {
      display: grid;
      grid-template-columns: repeat(2, minmax(0, 1fr));
      gap: 10px;
      margin-top: 12px;
    }
    .account-card {
      padding: 14px;
      min-height: 108px;
      display: grid;
      align-content: space-between;
      gap: 12px;
    }
    .icon-bg {
      width: 42px;
      height: 42px;
      border-radius: var(--radius-icon);
      display: grid;
      place-items: center;
      color: #fff;
      flex: 0 0 auto;
    }
    .filter-bar { margin: 16px 0 12px; }
    .summary-grid { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 10px; }
    .summary-card { padding: 14px; }
    .summary-card .amount { font-size: 20px; font-weight: 800; margin-top: 8px; }
    .analytics-strip { display: grid; gap: 10px; margin-top: 12px; }
    .mini-card { padding: 14px; }
    .segbar { height: 12px; border-radius: 999px; overflow: hidden; background: var(--surface2); display: flex; margin: 10px 0; }
    .segbar span { min-width: 3px; transition: width var(--ease); }
    .list { display: grid; gap: 9px; }
    .section-head { margin: 20px 0 10px; }
    .tx-row, .planned-row {
      padding: 12px;
      display: grid;
      grid-template-columns: auto minmax(0, 1fr) auto;
      gap: 10px;
      align-items: center;
    }
    .tx-row .amount, .planned-row .amount { font-weight: 800; font-family: Poppins, Inter, sans-serif; }
    .empty {
      padding: 24px 18px;
      text-align: center;
      display: grid;
      justify-items: center;
      gap: 10px;
    }
    .bottom-nav {
      position: fixed;
      left: 50%;
      bottom: 0;
      transform: translateX(-50%);
      width: min(100%, 520px);
      height: calc(var(--nav-h) + env(safe-area-inset-bottom));
      padding: 8px 10px calc(8px + env(safe-area-inset-bottom));
      background: rgba(33, 35, 46, .96);
      border-top: 1px solid var(--border);
      display: grid;
      grid-template-columns: repeat(5, 1fr);
      align-items: end;
      z-index: 40;
      backdrop-filter: blur(16px);
    }
    .nav-item {
      height: 60px;
      background: transparent;
      color: var(--text-secondary);
      display: grid;
      justify-items: center;
      align-content: center;
      gap: 4px;
      font-size: 11px;
      transition: color var(--ease), transform var(--ease);
    }
    .nav-item.active { color: var(--accent); }
    .nav-fab {
      width: 62px;
      height: 62px;
      border-radius: 22px;
      background: var(--accent);
      color: #fff;
      margin: 0 auto 18px;
      box-shadow: 0 12px 30px rgba(79,110,247,.35);
    }
    .overlay {
      position: fixed;
      inset: 0;
      display: none;
      z-index: 80;
      background: var(--bg);
      width: min(100%, 520px);
      left: 50%;
      transform: translateX(-50%);
      overflow: hidden;
    }
    .overlay.active { display: block; }
    .flow-viewport { height: 100%; overflow: hidden; }
    .flow-track {
      height: 100%;
      display: flex;
      transition: transform 200ms ease;
    }
    .flow-step {
      width: 100%;
      flex: 0 0 100%;
      padding: 18px 16px calc(22px + env(safe-area-inset-bottom));
      display: flex;
      flex-direction: column;
      gap: 16px;
      overflow-y: auto;
      -webkit-overflow-scrolling: touch;
    }
    .type-tabs, .tabs { display: grid; grid-template-columns: repeat(3, 1fr); gap: 8px; }
    .tabs.two { grid-template-columns: repeat(2, 1fr); }
    .amount-display {
      flex: 1;
      display: grid;
      place-items: center;
      min-height: 150px;
      font-family: Poppins, Inter, sans-serif;
      font-size: clamp(54px, 17vw, 78px);
      font-weight: 800;
      overflow-wrap: anywhere;
    }
    .numpad { display: grid; grid-template-columns: repeat(3, 1fr); gap: 10px; }
    .numkey {
      height: 64px;
      border-radius: 18px;
      background: var(--surface2);
      color: var(--text-primary);
      font-size: 24px;
      font-family: Poppins, Inter, sans-serif;
      transition: transform var(--ease), background var(--ease);
    }
    .flow-actions { display: flex; justify-content: flex-end; }
    .round-next { width: 62px; height: 62px; border-radius: 22px; }
    .category-grid, .icon-grid {
      display: grid;
      grid-template-columns: repeat(3, minmax(0, 1fr));
      gap: 12px;
    }
    .cat-tile {
      min-height: 112px;
      padding: 12px 8px;
      display: grid;
      justify-items: center;
      align-content: center;
      gap: 10px;
      text-align: center;
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: var(--radius-card);
    }
    .form-field { display: grid; gap: 8px; }
    .form-field label { color: var(--text-secondary); font-size: 13px; font-weight: 700; }
    .input, textarea {
      width: 100%;
      min-height: 48px;
      background: var(--surface2);
      border: 1px solid var(--border);
      border-radius: 14px;
      padding: 12px;
      outline: 0;
      transition: border-color var(--ease);
    }
    textarea { resize: vertical; min-height: 88px; }
    .input:focus, textarea:focus { border-color: var(--accent); }
    .date-display {
      min-height: 52px;
      border-radius: 14px;
      background: var(--surface2);
      padding: 0 12px;
      display: flex;
      align-items: center;
      justify-content: space-between;
    }
    .scrim {
      position: fixed;
      inset: 0;
      background: rgba(0,0,0,.55);
      z-index: 90;
      opacity: 0;
      pointer-events: none;
      transition: opacity 250ms ease;
    }
    .scrim.active { opacity: 1; pointer-events: auto; }
    .sheet {
      position: fixed;
      left: 50%;
      bottom: 0;
      transform: translate(-50%, 100%);
      width: min(100%, 520px);
      max-height: 88vh;
      z-index: 100;
      background: var(--surface);
      border: 1px solid var(--border);
      border-bottom: 0;
      border-radius: 24px 24px 0 0;
      padding: 16px 16px calc(18px + env(safe-area-inset-bottom));
      overflow-y: auto;
      -webkit-overflow-scrolling: touch;
      transition: transform 250ms ease-out;
    }
    .sheet.active { transform: translate(-50%, 0); }
    .roller {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 10px;
      margin: 12px 0;
    }
    .roller select {
      appearance: none;
      height: 168px;
      background: var(--surface2);
      border: 1px solid var(--border);
      border-radius: 16px;
      padding: 8px;
      outline: 0;
      overflow: auto;
    }
    .chart-card { padding: 16px; }
    .health-ring {
      width: 178px;
      height: 178px;
      margin: 10px auto;
      display: block;
    }
    .bar-row { display: grid; gap: 7px; margin: 12px 0; }
    .bar-line { height: 11px; border-radius: 99px; background: var(--surface2); overflow: hidden; }
    .bar-line span { display: block; height: 100%; border-radius: inherit; transition: width 600ms ease; }
    .donut-wrap { display: grid; justify-items: center; }
    .donut { width: 190px; height: 190px; }
    .legend { display: grid; gap: 8px; margin-top: 10px; }
    .dot { width: 10px; height: 10px; border-radius: 50%; display: inline-block; }
    .insight-card {
      min-width: 240px;
      max-width: 280px;
      padding: 14px;
      border-left: 4px solid var(--accent);
    }
    .settings-section { display: grid; gap: 10px; margin-bottom: 20px; }
    .settings-row {
      padding: 12px;
      display: grid;
      grid-template-columns: auto minmax(0,1fr) auto;
      gap: 10px;
      align-items: center;
    }
    .swatches { display: flex; flex-wrap: wrap; gap: 9px; }
    .swatch {
      width: 36px;
      height: 36px;
      border-radius: 12px;
      border: 2px solid transparent;
      background: var(--accent);
    }
    .swatch.active { border-color: #fff; }
    .icon-pick {
      width: 46px;
      height: 46px;
      border-radius: 14px;
      background: var(--surface2);
      color: var(--text-secondary);
      display: grid;
      place-items: center;
      border: 1px solid var(--border);
    }
    .icon-pick.active { color: #fff; border-color: var(--accent); background: var(--accent); }
    .toast {
      position: fixed;
      left: 50%;
      bottom: calc(var(--nav-h) + 22px);
      transform: translate(-50%, 20px);
      width: calc(min(100%, 520px) - 32px);
      z-index: 130;
      padding: 13px 16px;
      border-radius: 16px;
      background: var(--surface);
      border: 1px solid var(--border);
      color: var(--text-primary);
      opacity: 0;
      pointer-events: none;
      transition: opacity 180ms ease, transform 180ms ease;
    }
    .toast.active { opacity: 1; transform: translate(-50%, 0); }
    .flash {
      position: fixed;
      inset: 0;
      width: min(100%, 520px);
      left: 50%;
      transform: translateX(-50%);
      z-index: 120;
      display: none;
      place-items: center;
      background: rgba(19,20,26,.74);
    }
    .flash.active { display: grid; }
    .flash .mark {
      width: 90px;
      height: 90px;
      border-radius: 30px;
      background: var(--income);
      display: grid;
      place-items: center;
      color: #fff;
    }
    @media (max-width: 380px) {
      .category-grid, .icon-grid { grid-template-columns: repeat(2, minmax(0, 1fr)); }
      .summary-grid { grid-template-columns: 1fr; }
      .hero { padding: 18px; }
      .nav-item span { font-size: 10px; }
    }
  </style>
</head>
<body>
  <main class="app" id="app">
    <section class="screen active" id="screen-home"></section>
    <section class="screen" id="screen-analytics"></section>
    <section class="screen" id="screen-planned"></section>
    <section class="screen" id="screen-settings"></section>
  </main>

  <nav class="bottom-nav" aria-label="Wallet navigation">
    <button class="nav-item active" data-screen="home"><span data-icon="home"></span><span>Home</span></button>
    <button class="nav-item" data-screen="analytics"><span data-icon="chart"></span><span>Analytics</span></button>
    <button class="nav-item nav-fab" id="openAdd" aria-label="Add transaction"><span data-icon="plus"></span></button>
    <button class="nav-item" data-screen="planned"><span data-icon="calendar"></span><span>Planned</span></button>
    <button class="nav-item" data-screen="settings"><span data-icon="settings"></span><span>Settings</span></button>
  </nav>

  <div class="overlay" id="addOverlay" aria-hidden="true">
    <div class="flow-viewport">
      <div class="flow-track" id="flowTrack">
        <section class="flow-step" id="addStep1"></section>
        <section class="flow-step" id="addStep2"></section>
        <section class="flow-step" id="addStep3"></section>
      </div>
    </div>
  </div>
  <div class="scrim" id="scrim"></div>
  <section class="sheet" id="sheet"></section>
  <div class="flash" id="flash"><div class="mark" data-icon="check"></div></div>
  <div class="toast" id="toast"></div>

  <script>
  (() => {

    function txEffect(tx, accId) {
      const amt = Number(tx.amount || 0);
      if (tx.type === 'income' && tx.accId === accId) return amt;
      if (tx.type === 'expense' && tx.accId === accId) return -amt;

        if (tx.toAccId === accId) return amt;
      }
      return 0;

      const acc = accountById(accId);

      return acc.balance;
    }
    function recalculateAllBalances() { state.data.accounts.forEach(a => recalculateAccountBalance(a.id)); }
    function getAccountBalance(accId) { return recalculateAccountBalance(accId); }

      const wants = ['Restaurant','Fast Food','Cafe','Ride-share','Clothing','Shoes','Accessories','Electronics','Cinema','Streaming','Events','Gaming','Salon','Grooming','Beauty'];
      const invest = ['Charity','Zakat','Sadaqah'];

    function inFilterDate(iso, filter) {
      const d = new Date(iso + 'T00:00:00');
      const now = new Date(todayISO() + 'T00:00:00');
      const diff = Math.floor((now - d) / 86400000);
      if (filter === 'today') return diff === 0;
      if (filter === '7d') return diff >= 0 && diff <= 6;
      if (filter === '30d') return diff >= 0 && diff <= 29;
      if (filter === 'thisMonth') return d.getMonth() === now.getMonth() && d.getFullYear() === now.getFullYear();
      return true;
    }

      const now = new Date(todayISO() + 'T00:00:00');
      let start, end;
      if (period === 'lastMonth') {
        start = new Date(now.getFullYear(), now.getMonth() - 1, 1);
        end = new Date(now.getFullYear(), now.getMonth(), 0);
      } else if (period === '3months') {
        start = new Date(now.getFullYear(), now.getMonth() - 2, 1);
        end = now;
      } else if (period === 'year') {
        start = new Date(now.getFullYear(), 0, 1);
        end = now;
      } else {
        start = new Date(now.getFullYear(), now.getMonth(), 1);
        end = now;
      }
      return { start, end };

    function accountChips(selected, field) {

    }
    function inputAmount(obj, key, rerender) {
      let v = String(obj.amount || '0');
      if (key === 'back') v = v.length > 1 ? v.slice(0, -1) : '0';
      else if (key === '.') { if (!v.includes('.')) v += '.'; }
      else {
        const [whole, dec = ''] = v.split('.');
        if (v.includes('.') && dec.length >= 2) return;
        if (!v.includes('.') && whole.replace(/^0+/, '').length >= 8) return;
        v = v === '0' ? key : v + key;
        v = v.replace(/^0+(\d)/, '$1');
      }
      obj.amount = v;
      rerender();
    }
    function saveAddTransaction() {
      if (state.add.type === 'transfer' && state.add.fromAccId === state.add.toAccId) return toast('Choose two different accounts');
      const tx = {
        amount: Number(state.add.amount),
        type: state.add.type,

    function renderAnalytics() {
      const root = $('#screen-analytics');
      const txs = state.data.transactions.filter(t => txInRange(t, state.analyticsPeriod));
      const prevTxs = previousPeriodTxs(state.analyticsPeriod);
      const sum = sums(txs);
      const prev = sums(prevTxs);
      const expenseTxs = txs.filter(t => t.type === 'expense');
      const incomeTxs = txs.filter(t => t.type === 'income');
      const byTag = groupByAmount(expenseTxs, t => t.tag);
      const score = calculateHealthScore(txs, prevTxs);
      const label = score >= 80 ? ['Excellent','#22c55e'] : score >= 60 ? ['Good','#f59e0b'] : score >= 40 ? ['Fair','#f97316'] : ['Needs Attention','#f43f5e'];
      const incomeByCat = Object.entries(groupByAmount(incomeTxs, t => t.catName)).sort((a,b) => b[1]-a[1]);
      const expenseByCat = Object.entries(groupByAmount(expenseTxs, t => t.catName)).sort((a,b) => b[1]-a[1]);
      const drill = state.drilledCategory;
      const donutData = drill ? Object.entries(groupByAmount(expenseTxs.filter(t => t.catName === drill), t => t.subcat)).sort((a,b)=>b[1]-a[1]) : expenseByCat;
      const totalExpense = sum.expense || 1;
      const topSubs = Object.entries(groupByAmount(expenseTxs, t => t.subcat)).sort((a,b)=>b[1]-a[1]).slice(0,5);
      
      const analyticsPeriods = [
        ['today', 'Today'], ['thisWeek', 'This Week'], ['7d', '7D'], ['30d', '30D'], 
        ['thisMonth', 'This Month'], ['lastMonth', 'Last Month'], ['3months', '3 Months'], ['year', 'Year']
      ];

      root.innerHTML = `
        <div class="topbar"><h1>Analytics</h1></div>
        <div class="scroll-x filter-bar">${analyticsPeriods.map(([id,l]) => `<button class="chip ${state.analyticsPeriod === id ? 'active' : ''}" data-period="${id}">${l}</button>`).join('')}</div>
        ${txs.length ? `
          <section class="card chart-card">
            <h2>Financial Health</h2>
            ${healthRing(score, label[1])}
            <h2 style="text-align:center;color:${label[1]}">${label[0]}</h2>
          </section>
          <section class="card chart-card">
            <div class="between"><h2>Income Breakdown</h2><p>${pctChange(sum.income, prev.income)}</p></div>
            ${incomeByCat.length ? incomeByCat.map(([name, amt], i) => barLine(name, amt, incomeByCat[0][1], i === 0 ? 'star' : 'money', 'var(--accent)')).join('') : emptyInline('No income in this period')}
          </section>
          <section class="card chart-card">
            <div class="between"><h2>${drill ? esc(drill) : 'Expense Donut'}</h2>${drill ? '<button class="chip" id="clearDrill">All</button>' : ''}</div>
            <div class="donut-wrap" style="display:flex; flex-direction:row; align-items:center; justify-content:space-around; flex-wrap:wrap;">${donut(donutData, sum.expense, drill)}</div>
          </section>
          <section class="card chart-card">
            <h2>50/30/20 Progress</h2>
            ${Object.entries(tagMeta).map(([id,m]) => progressRow(m.label, m.target, Math.round(((byTag[id] || 0) / totalExpense) * 100), m.color)).join('')}
          </section>
          <section class="card chart-card">
            <h2>Top Subcategories</h2>
            ${topSubs.length ? topSubs.map(([name, amt]) => barLine(name, amt, topSubs[0][1], 'grid', 'var(--accent)', `${Math.round(amt / totalExpense * 100)}%`)).join('') : emptyInline('No spending yet')}
          </section>
          <div class="section-head"><h2>Behavior Insights</h2></div>
          <div class="scroll-x">${generateInsightCards(txs, prevTxs, score).join('')}</div>
        ` : emptyCard('calendar', 'No data for this period', 'Transactions will build your analytics automatically.')}
      `;
      $$('[data-period]', root).forEach(b => b.onclick = () => { state.analyticsPeriod = b.dataset.period; state.drilledCategory = null; renderAnalytics(); });
      $('#clearDrill')?.addEventListener('click', () => { state.drilledCategory = null; renderAnalytics(); });
      $$('[data-drill]', root).forEach(b => b.onclick = () => { state.drilledCategory = b.dataset.drill; renderAnalytics(); });
      renderIcons(root);
    }
    function calculateHealthScore(txs, prevTxs) {
      const s = sums(txs), p = sums(prevTxs);
      const expenseTxs = txs.filter(t => t.type === 'expense');
      const byTag = groupByAmount(expenseTxs, t => t.tag);
      const total = s.expense || 1;
      const wantsPct = (byTag.wants || 0) / total * 100;
      const investPct = (byTag.invest || 0) / total * 100;
      const growth = p.expense ? ((s.expense - p.expense) / p.expense * 100) : 0;
      let score = 100;
      if (wantsPct > 60) score -= Math.min(30, ((wantsPct - 60) / 40) * 30);
      if (investPct < 20) score -= Math.min(30, ((20 - investPct) / 20) * 30);
      if (growth > 20) score -= Math.min(20, ((growth - 20) / 80) * 20);
      if (s.expense > s.income && s.income > 0) score -= 10;
      return Math.max(0, Math.round(score));
    }
    
    function previousPeriodTxs(period) {
      const { start, end } = rangeForPeriod(period);
      const diff = end - start;
      const prevEnd = new Date(start - 86400000);
      const prevStart = new Date(prevEnd - diff);
      return state.data.transactions.filter(t => { 
        const d = new Date(t.date + 'T00:00:00'); 
        return d >= prevStart && d <= prevEnd; 
      });
    }

    function healthRing(score, color) {
      const c = 2 * Math.PI * 52;
      return `<svg class="health-ring" viewBox="0 0 140 140">
        <circle cx="70" cy="70" r="52" stroke="var(--surface2)" stroke-width="14" fill="none"/>
        <circle cx="70" cy="70" r="52" stroke="${color}" stroke-width="14" fill="none" stroke-linecap="round" transform="rotate(-90 70 70)" stroke-dasharray="${c}" stroke-dashoffset="${c - c * score / 100}" style="transition:stroke-dashoffset 800ms ease"/>
        <text x="70" y="75" text-anchor="middle" fill="var(--text-primary)" font-family="Poppins" font-size="30" font-weight="800">${score}</text>
      </svg>`;
    }
    function barLine(name, amt, max, ic, color, suffix = '') {
      return `<div class="bar-row"><div class="between"><div class="row ellipsis"><span data-icon="${ic}"></span><h3 class="ellipsis">${esc(name)}</h3></div><p>${suffix || money(amt)}</p></div><div class="bar-line"><span style="background:${color};width:${max ? amt / max * 100 : 0}%"></span></div></div>`;
    }
    function progressRow(label, target, actual, color) {
      const off = Math.abs(actual - target);
      const c = off <= 5 ? 'var(--income)' : off <= 15 ? 'var(--wants)' : 'var(--expense)';
      return `<div class="bar-row"><div class="between"><h3>${label} <span class="muted tiny">${target}% target</span></h3><p style="color:${c}">${actual}%</p></div><div class="bar-line"><span style="background:${color};width:${Math.min(actual,100)}%"></span></div></div>`;
    }
    function donut(data, total, drilled) {
      if (!data.length) return emptyInline('No expenses yet');
      let offset = 25;
      const r = 15.9155;
      const slices = data.map(([name, amt], i) => {
        const cat = state.data.expenseCategories.find(c => c.name === name);
        const color = drilled ? colors[i % colors.length] : (cat?.color || colors[i % colors.length]);
        const pct = total ? amt / total * 100 : 0;
        const s = `<circle r="${r}" cx="20" cy="20" fill="none" stroke="${color}" stroke-width="9" stroke-dasharray="${pct} ${100 - pct}" stroke-dashoffset="${offset}"/>`;
        offset -= pct;
        return s;
      }).join('');
      const legend = data.map(([name, amt], i) => {
        const cat = state.data.expenseCategories.find(c => c.name === name);
        const color = drilled ? colors[i % colors.length] : (cat?.color || colors[i % colors.length]);
        return `<button class="between chip" style="width:100%; border:none; background:transparent; padding:4px 0;" ${drilled ? '' : `data-drill="${esc(name)}"`}><span class="row tiny"><span class="dot" style="background:${color}; width:8px; height:8px;"></span>${esc(name)}</span><span class="tiny">${Math.round(amt/total*100)}%</span></button>`;
      }).join('');
      return `
        <svg class="donut" viewBox="0 0 40 40" style="width:130px; height:130px;">${slices}<circle cx="20" cy="20" r="10" fill="var(--surface)"/><text x="20" y="21.5" text-anchor="middle" fill="var(--text-primary)" font-family="Poppins" font-size="4" font-weight="800">${drilled ? 'Back' : 'Expenses'}</text></svg>
        <div class="legend" style="flex:1; max-width:180px; display:grid; gap:4px; margin:0;">${legend}</div>`;
    }
    function pctChange(now, prev) {
      if (!prev && now) return '+100%';
      if (!prev) return '0%';
      const v = Math.round((now - prev) / prev * 100);
      return `${v >= 0 ? '+' : ''}${v}%`;
    }
    function generateInsightCards(txs, prevTxs, score) {
      const s = sums(txs), p = sums(prevTxs);
      const expenseTxs = txs.filter(t => t.type === 'expense');
      const byTag = groupByAmount(expenseTxs, t => t.tag);
      const total = s.expense || 1;
      const wantsPct = Math.round((byTag.wants || 0) / total * 100);
      const savings = s.income ? Math.round((s.income - s.expense) / s.income * 100) : 0;
      const growth = p.expense ? Math.round((s.expense - p.expense) / p.expense * 100) : 0;
      const bySub = Object.entries(groupByAmount(expenseTxs, t => t.subcat)).sort((a,b)=>b[1]-a[1])[0];
      const days = Math.max(1, new Date().getDate());
      const daily = s.expense / days;
      const projected = daily * new Date(new Date().getFullYear(), new Date().getMonth()+1, 0).getDate();
      const cards = [];
      const add = (title, body, color) => cards.push(`<div class="card insight-card" style="border-left-color:${color}"><h3>${esc(title)}</h3><p>${esc(body)}</p></div>`);
      if (growth > 0) add(`Spending up ${growth}%`, 'This period is running above the previous one.', '#f59e0b');
      if (growth < 0) add(`Spending down ${Math.abs(growth)}%`, 'Great discipline compared with the previous period.', '#22c55e');
      if (wantsPct > 60) add(`Lifestyle spending is ${wantsPct}%`, 'That is above the 30% target.', '#f43f5e');
      if (savings < 10 && s.income) add(`Critical: only ${savings}% saved`, 'Aim for at least 20%.', '#f43f5e');
      else if (savings < 20 && s.income) add(`Savings at ${savings}%`, 'A little more margin would help.', '#f59e0b');
      if (s.expense > s.income && s.income) add('Deficit alert', `Spending ${money(s.expense - s.income)} more than earned.`, '#f43f5e');
      if (bySub && bySub[1] / total > .3) add(`${bySub[0]} dominates`, `${bySub[0]} is ${Math.round(bySub[1] / total * 100)}% of spending.`, '#f59e0b');
      add('Daily average spend', `${money(daily)} projected to ${money(projected)} this month.`, '#4f6ef7');
      if (score > 80) add(`Financial health score: ${score}`, 'Excellent discipline.', '#22c55e');
      return cards;
    }
    function emptyInline(text) { return `<p style="padding:14px 0">${esc(text)}</p>`; }

    function renderPlanned() {
      const root = $('#screen-planned');
      const planned = state.data.planned.filter(p => p.status !== 'confirmed').sort((a,b)=>a.dueDate.localeCompare(b.dueDate));

          <details style="margin-top:16px"><summary class="chip">Settled loans (${settled.length})</summary><section class="list" style="margin-top:10px;opacity:.65">${settled.map(loanCard).join('') || emptyInline('No settled loans')}</section></details>

      $('#addPlanBtn').onclick = () => state.plannedTab === 'loans' ? openLoanSheet() : openPlannedSheet();

      $$('[data-settle-loan]', root).forEach(b => b.onclick = () => settleLoan(b.dataset.settleLoan));
      $$('[data-edit-loan]', root).forEach(b => b.onclick = () => openLoanSheet(b.dataset.editLoan));
      $$('[data-del-loan]', root).forEach(b => b.onclick = () => deleteLoan(b.dataset.delLoan));
      renderIcons(root);
    }
    function plannedCard(p) {
      const d = daysBetween(p.dueDate);
      const text = d < 0 ? `Overdue ${Math.abs(d)} days` : d === 0 ? 'Due today' : `Due in ${d} days`;
      return `<div class="card mini-card stack">
        <div class="between"><h3>${esc(p.title)}</h3><span class="icon-bg" style="background:${p.type === 'income' ? 'var(--income)' : 'var(--expense)'}">${icon(p.type === 'income' ? 'download' : 'upload')}</span></div>
        <div class="between"><p>${esc(p.subcat || p.catName || '')} · ${esc(accountById(p.accId).name)}</p>${amountHTML(p.amount, p.type === 'income' ? 'income-color' : 'expense-color')}</div>
        <p style="${d < 0 ? 'color:var(--expense)' : ''}">${text}</p>
        <div class="scroll-x"><button class="chip active" data-confirm-plan="${p.id}" data-icon="check">Confirm</button><button class="chip" data-edit-plan="${p.id}" data-icon="edit">Edit</button><button class="chip" data-del-plan="${p.id}" data-icon="trash">Delete</button></div>
      </div>`;
    }
    function loanCard(l) {
      const d = daysBetween(l.dueDate);
      const text = d < 0 ? `Overdue ${Math.abs(d)} days` : d === 0 ? 'Due today' : `Due in ${d} days`;
      return `<div class="card mini-card stack">
        <div class="between"><h3>${esc(l.person)}</h3><span class="chip ${l.type === 'taken' ? 'needs' : 'wants'}">${cap(l.type)}</span></div>
        <div class="between"><p style="${d < 0 ? 'color:var(--expense)' : ''}">${text}</p>${amountHTML(l.amount, l.type === 'taken' ? 'income-color' : 'expense-color')}</div>
        ${l.note ? `<p>${esc(l.note)}</p>` : ''}
        ${l.status !== 'settled' ? `<div class="scroll-x"><button class="chip active" data-settle-loan="${l.id}" data-icon="check">Settle</button><button class="chip" data-edit-loan="${l.id}" data-icon="edit">Edit</button><button class="chip" data-del-loan="${l.id}" data-icon="trash">Delete</button></div>` : ''}
      </div>`;
    }
    function confirmPlanned(id) {
      const p = state.data.planned.find(x => x.id === id);
      if (!p) return;
      addTransaction({ amount:p.amount, type:p.type, date:todayISO(), accId:p.accId, catId:p.catId, catName:p.catName, subcat:p.subcat, tag:p.tag || 'needs', note:p.title });
      p.status = 'confirmed';
      if (p.repeat === 'weekly' || p.repeat === 'monthly') {
        const next = { ...p, id:uid('plan'), status:'pending', dueDate:addDate(p.dueDate, p.repeat === 'weekly' ? 7 : 0, p.repeat === 'monthly' ? 1 : 0) };
        state.data.planned.push(next);
      }
      saveData(); renderApp(); toast('Planned transaction confirmed');
    }
    function deletePlanned(id) { if (confirm('Delete this planned transaction?')) { state.data.planned = state.data.planned.filter(p => p.id !== id); saveData(); renderPlanned(); } }
    function settleLoan(id) {
      const l = state.data.loans.find(x => x.id === id);
      if (!l) return;
      l.status = 'settled';
      recalculateAllBalances();
      const acc = accountById(l.accId);
      acc.openingBalance = Number(acc.openingBalance || 0) + (l.type === 'given' ? Number(l.amount) : -Number(l.amount));
      recalculateAllBalances();
      saveData(); renderApp(); toast('Loan settled');
    }
    function deleteLoan(id) { if (confirm('Delete this loan?')) { state.data.loans = state.data.loans.filter(l => l.id !== id); saveData(); renderPlanned(); } }
    function addDate(iso, days, months) { const d = new Date(iso + 'T00:00:00'); d.setDate(d.getDate()+days); d.setMonth(d.getMonth()+months); return d.toISOString().slice(0,10); }

    function renderSettings() {
      const root = $('#screen-settings');
      root.innerHTML = `
        <div class="topbar"><h1>Settings</h1></div>

        ${settingsSection('Appearance', `

    function settingsSection(title, body) { return `<section class="settings-section"><h2>${title}</h2>${body}</section>`; }

      $('#btnCustomExport').onclick = () => {

      };

    function exportCustomRangeCsv(startDate, endDate) {
      const txs = state.data.transactions.filter(t => t.date >= startDate && t.date <= endDate);
      if(txs.length === 0) return toast('No transactions in this range');
      
      const rows = [['date','type','amount','account','category','subcategory','tag','note'], 
        ...txs.map(t => [t.date,t.type,t.amount,accountById(t.accId).name,t.catName,t.subcat,t.tag,t.note])];
      const csv = rows.map(r => r.map(v => `"${String(v ?? '').replace(/"/g,'""')}"`).join(',')).join('\n');
      const blob = new Blob([csv], { type:'text/csv' });
      const a = document.createElement('a');
      a.href = URL.createObjectURL(blob);
      a.download = `wallet_export_${startDate}_to_${endDate}.csv`;
      a.click();
      URL.revokeObjectURL(a.href);
    }

        <div class="form-field"><label>Account</label><div class="scroll-x">${state.data.accounts.map(a => `<button class="chip ${tx.accId === a.id ? 'active' : ''}" data-tx-acc="${a.id}">${esc(a.name)}</button>`).join('')}</div></div>
        <div class="form-field"><label>Tag</label><div class="scroll-x">${Object.entries(tagMeta).map(([id,m]) => `<button class="chip ${id} ${tx.tag === id ? 'active' : ''}" data-tx-tag="${id}">${m.label}</button>`).join('')}</div></div>` : `

        <div class="form-field"><label>To Account</label><div class="scroll-x">${state.data.accounts.map(a => `<button class="chip ${tx.toAccId === a.id ? 'active' : ''}" data-tx-to="${a.id}">${esc(a.name)}</button>`).join('')}</div></div>`}

    function bindTxSheet(tx) {
      $('#closeSheet').onclick = closeSheet;
      const local = { ...tx };
      $$('[data-tx-type]').forEach(b => b.onclick = () => { local.type = b.dataset.txType; local.catId = (local.type === 'income' ? state.data.incomeCategories[0].id : state.data.expenseCategories[0].id); local.catName = catById(local.catId, local.type).name; openSheet(editTxForm(local)); bindTxSheet(local); });
      $$('[data-tx-cat]').forEach(b => b.onclick = () => { const c = catById(b.dataset.txCat, local.type); local.catId = c.id; local.catName = c.name; local.subcat = c.subs[0] || 'Other'; local.tag = local.type === 'expense' ? autoAssignTag(local.subcat) : 'needs'; openSheet(editTxForm(local)); bindTxSheet(local); });
      $$('[data-tx-sub]').forEach(b => b.onclick = () => { local.subcat = b.dataset.txSub; local.tag = autoAssignTag(local.subcat); openSheet(editTxForm(local)); bindTxSheet(local); });
      $$('[data-tx-acc]').forEach(b => b.onclick = () => { local.accId = b.dataset.txAcc; openSheet(editTxForm(local)); bindTxSheet(local); });
      $$('[data-tx-to]').forEach(b => b.onclick = () => { local.toAccId = b.dataset.txTo; openSheet(editTxForm(local)); bindTxSheet(local); });
      $$('[data-tx-tag]').forEach(b => b.onclick = () => { local.tag = b.dataset.txTag; openSheet(editTxForm(local)); bindTxSheet(local); });
      $('#txDate').onclick = () => openDatePicker(local.date, d => { local.date = d; openSheet(editTxForm(local)); bindTxSheet(local); });
      $('#saveTx').onclick = () => {
        const amount = Number($('#txAmount').value || 0);
        if (amount <= 0) return toast('Amount must be greater than zero');
        if (local.type === 'transfer' && local.accId === local.toAccId) return toast('Choose two different accounts');
        editTransaction(tx.id, { ...local, amount, note: $('#txNote').value });
        closeSheet(); renderApp(); toast('Transaction updated');
      };
      $('#deleteTx').onclick = () => { if (confirm('Delete this transaction?')) { deleteTransaction(tx.id); closeSheet(); renderApp(); } };
      renderIcons($('#sheet'));
    }

              </div>
          `).join('')}
      </div><button class="btn secondary small" id="addSub" data-icon="plus" style="margin-top:8px">Add Subcategory</button></div>
      <div class="sheet-actions">
          <button class="btn" id="saveCat">Save</button>
          ${c.id ? '<button class="btn danger" id="deleteCat">Delete</button>' : ''}
      </div>`;
    }
    function bindCategorySheet(type, cat) {
      let c = { ...cat, subs:[...(cat.subs || [])] };
      $('#closeSheet').onclick = closeSheet;
      $$('[data-cat-color]').forEach(b => b.onclick = () => { c.color = b.dataset.catColor; updateSubsFromDOM(c); openSheet(categoryForm(type,c)); bindCategorySheet(type,c); });
      $$('[data-cat-icon]').forEach(b => b.onclick = () => { c.icon = b.dataset.catIcon; updateSubsFromDOM(c); openSheet(categoryForm(type,c)); bindCategorySheet(type,c); });
      $$('[data-tag]').forEach(b => b.onclick = () => { c.tag = b.dataset.tag; updateSubsFromDOM(c); openSheet(categoryForm(type,c)); bindCategorySheet(type,c); });
      
      $('#addSub').onclick = () => { 
          updateSubsFromDOM(c);
          c.subs.push(''); 
          openSheet(categoryForm(type,c)); 
          bindCategorySheet(type,c); 
      };
      
      $$('[data-remove-sub]').forEach(b => b.onclick = () => { 
          updateSubsFromDOM(c);
          c.subs = c.subs.filter((_,i) => i !== Number(b.dataset.removeSub)); 
          openSheet(categoryForm(type,c)); 
          bindCategorySheet(type,c); 
      });

      $('#saveCat').onclick = () => {
        const list = type === 'expense' ? state.data.expenseCategories : state.data.incomeCategories;
        c.name = $('#catName').value.trim() || 'Category';
        updateSubsFromDOM(c);
        c.subs = c.subs.filter(Boolean);
        if (c.id) Object.assign(list.find(x => x.id === c.id), c);
        else list.push({ ...c, id: uid(type === 'expense' ? 'expcat' : 'inccat') });
        saveData(); closeSheet(); renderApp();
      };
      $('#deleteCat')?.addEventListener('click', () => {
        const count = state.data.transactions.filter(t => t.catId === c.id).length;
        if (count) return toast(`Cannot delete: ${count} transactions use this category`);
        if (confirm('Delete this category?')) {
          const listName = type === 'expense' ? 'expenseCategories' : 'incomeCategories';
          state.data[listName] = state.data[listName].filter(x => x.id !== c.id);
          saveData(); closeSheet(); renderApp();
        }
      });
      renderIcons($('#sheet'));
    }
    function updateSubsFromDOM(catObj) {
        catObj.subs = $$('[data-sub-input]').map(i => i.value.trim());
    }

    function openDatePicker(current, onPick) {
      const d = new Date(current + 'T00:00:00');
      const year = d.getFullYear();
      openSheet(`<div class="between"><h2>Select Date</h2><button class="icon-btn" id="closeSheet" data-icon="x"></button></div>
        <div class="roller">
          <select id="rollDay" size="7">${Array.from({length:31},(_,i)=>`<option value="${i+1}" ${d.getDate()===i+1?'selected':''}>${i+1}</option>`).join('')}</select>
          <select id="rollMonth" size="7">${Array.from({length:12},(_,i)=>`<option value="${i}" ${d.getMonth()===i?'selected':''}>${new Date(2020,i,1).toLocaleString('en-US',{month:'short'})}</option>`).join('')}</select>
          <select id="rollYear" size="7">${Array.from({length:11},(_,i)=>year-5+i).map(y=>`<option value="${y}" ${year===y?'selected':''}>${y}</option>`).join('')}</select>
        </div>
        <button class="btn" id="saveDate">Done</button>`);
      $('#closeSheet').onclick = closeSheet;
      $('#saveDate').onclick = () => {
        const y = Number($('#rollYear').value), m = Number($('#rollMonth').value), day = Number($('#rollDay').value);
        const max = new Date(y, m + 1, 0).getDate();
        const iso = new Date(y, m, Math.min(day, max)).toISOString().slice(0,10);
        closeSheet(); onPick(iso);
      };
      renderIcons($('#sheet'));
    }
    function openSheet(html) {
      $('#sheet').innerHTML = html;
      $('#scrim').classList.add('active');
      $('#sheet').classList.add('active');
      renderIcons($('#sheet'));
    }
    function closeSheet() {
      $('#sheet').classList.remove('active');
      $('#scrim').classList.remove('active');
    }
    function toast(text) {
      const el = $('#toast');
      el.textContent = text;
      el.classList.add('active');
      clearTimeout(toast.timer);
      toast.timer = setTimeout(() => el.classList.remove('active'), 2200);
    }
    function showFlash() {
      $('#flash').classList.add('active');
      renderIcons($('#flash'));
      setTimeout(() => $('#flash').classList.remove('active'), 380);
    }
    function cap(s) { return String(s).replace(/-/g,' ').replace(/^\w/, c => c.toUpperCase()); }
    function exportLastMonthCsv() {
      const txs = state.data.transactions.filter(t => txInRange(t, 'lastMonth'));
      const rows = [['date','type','amount','account','category','subcategory','tag','note'], ...txs.map(t => [t.date,t.type,t.amount,accountById(t.accId).name,t.catName,t.subcat,t.tag,t.note])];
      const csv = rows.map(r => r.map(v => `"${String(v ?? '').replace(/"/g,'""')}"`).join(',')).join('\n');
      const blob = new Blob([csv], { type:'text/csv' });
      const a = document.createElement('a');
      a.href = URL.createObjectURL(blob);
      a.download = 'wallet-last-month.csv';
      a.click();
      URL.revokeObjectURL(a.href);
    }
    function deleteOldTransactions() {
      if (!confirm('Delete transactions older than 3 months?')) return;
      const cutoff = new Date(todayISO() + 'T00:00:00');
      cutoff.setMonth(cutoff.getMonth() - 3);
      state.data.transactions = state.data.transactions.filter(t => new Date(t.date + 'T00:00:00') >= cutoff);
      recalculateAllBalances(); saveData(); renderApp();
    }
    function clearAllData() {
      if (!confirm('Clear all Wallet data?')) return;
      const ok = prompt('Type DELETE to confirm');
      if (ok === 'DELETE') { localStorage.removeItem(STORE_KEY); initData(); renderApp(); }
    }
    function buildDriveSummary() {
      const month = state.data.transactions.filter(t => txInRange(t, 'thisMonth'));
      const s = sums(month);
      const expenses = month.filter(t => t.type === 'expense');
      const byTag = groupByAmount(expenses, t => t.tag);
      const top = Object.entries(groupByAmount(expenses, t => t.catName)).sort((a,b)=>b[1]-a[1])[0];
      const total = s.expense || 1;
      return {
        totalBalance: state.data.accounts.reduce((x,a)=>x+Number(a.balance),0),
        thisMonthIncome: s.income,
        thisMonthExpense: s.expense,
        needsPercent: Math.round((byTag.needs || 0) / total * 100),
        wantsPercent: Math.round((byTag.wants || 0) / total * 100),
        investPercent: Math.round((byTag.invest || 0) / total * 100),
        healthScore: calculateHealthScore(month, previousPeriodTxs('thisMonth')),
        topSpendingCategory: top?.[0] || null,
        upcomingPlanned: state.data.planned.filter(p => daysBetween(p.dueDate) >= 0 && daysBetween(p.dueDate) <= 7).map(p => ({ title:p.title, amount:p.amount, dueDate:p.dueDate, type:p.type })),
        activeLoans: state.data.loans.filter(l => l.status !== 'settled').map(l => ({ person:l.person, amount:l.amount, type:l.type }))
      };
    }
    async function backupToDrive() {
      const CLIENT_ID = 'PASTE_GOOGLE_OAUTH_CLIENT_ID_HERE';
      void CLIENT_ID;
      state.data.settings.lastBackup = new Date().toISOString();
      saveData();
      const backup = { wallet: state.data, nexus: buildDriveSummary() };
      const blob = new Blob([JSON.stringify(backup, null, 2)], { type:'application/json' });
      const a = document.createElement('a');
      a.href = URL.createObjectURL(blob);
      a.download = `wallet_backup_${todayISO()}.json`;
      a.click();
      URL.revokeObjectURL(a.href);
      toast('Google Drive OAuth placeholder ready. Local backup downloaded.');
      renderSettings();
    }
    function restoreFromDrive() {
      const input = document.createElement('input');
      input.type = 'file';
      input.accept = 'application/json';
      input.onchange = async () => {
        const file = input.files[0];
        if (!file) return;
        const data = JSON.parse(await file.text());
        if (!confirm('This will overwrite all local data. Continue?')) return;
        localStorage.setItem(STORE_KEY, JSON.stringify(data.wallet || data));
        initData(); renderApp(); toast('Data restored');
      };
      input.click();
    }
    function switchScreen(screen) {
      if (!screen || screen === state.screen) return;
      state.screen = screen;
      $$('.screen').forEach(s => s.classList.toggle('active', s.id === `screen-${screen}`));
      $$('.nav-item[data-screen]').forEach(b => b.classList.toggle('active', b.dataset.screen === screen));
      if (screen === 'analytics') renderAnalytics();
      if (screen === 'planned') renderPlanned();
      if (screen === 'settings') renderSettings();
      window.scrollTo({ top: 0, behavior: 'smooth' });
    }

    document.addEventListener('click', e => {
      const nav = e.target.closest('.nav-item[data-screen]');
      if (nav) switchScreen(nav.dataset.screen);
    });
    $('#openAdd').addEventListener('click', openAddFlow);
    $('#scrim').addEventListener('click', closeSheet);
    initData();
    renderApp();
    if ('serviceWorker' in navigator) {
      window.addEventListener('load', () => navigator.serviceWorker.register('sw.js').catch(() => {}));
    }
  })();
  </script>
</body>
</html>
